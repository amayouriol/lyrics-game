# On every push (any branch) and every pull request: lint, rule checks, build.
# No Spotify keys needed; they're only read when the app runs.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyrics-game
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lyrics-game/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
